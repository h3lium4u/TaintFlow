name: Documentation Update
description: Suggest improvements, corrections, or updates to TaintFlow documentation.
body:
  - type: textarea
    id: details
    attributes:
      label: Documentation Page
      description: Which docs page requires updating? (Provide link if possible).
      placeholder: E.g., docs/Installation.md
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Proposed Updates
      description: Describe the changes you suggest making.
    validations:
      required: true
