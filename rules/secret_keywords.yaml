# TaintFlow+ Secret Keywords (CWE-798) Catalog

keywords:
  - "password"
  - "passwd"
  - "pass"
  - "secret"
  - "api_key"
  - "apikey"
  - "token"
  - "private_key"
  - "access_token"
  - "client_secret"
  - "db_password"
  - "db_pass"
  - "db_user"
  - "auth_token"
  - "credentials"

regex_patterns:
  - name: generic_secret
    pattern: "(?i)(password|secret|key|token|passwd|pass|auth|credential)\\s*[:=]\\s*[\"']([^\"']{8,128})[\"']"
  - name: slack_token
    pattern: "xox[bapr]-[0-9]{12}-[0-9]{12}-[a-zA-Z0-9]{24}"
  - name: aws_access_key
    pattern: "(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"
  - name: aws_secret_key
    pattern: "(?i)aws_secret_access_key\\s*[:=]\\s*[\"']([a-zA-Z0-9/+=]{40})[\"']"
  - name: ssh_private_key
    pattern: "-----BEGIN [A-Z]+ PRIVATE KEY-----"

entropy:
  min_entropy: 4.5
  min_length: 12
