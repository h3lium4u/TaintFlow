name: Continuous Integration

on:
  push:
    branches: [ main, release/v1.0.0 ]
  pull_request:
    branches: [ main, release/v1.0.0 ]

jobs:
  build_and_test:
    name: Build & Test (Rust stable, Linux)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-engine

      - name: Check Formatting
        run: cargo fmt --all -- --check
        working-directory: rust-engine

      - name: Run Clippy Linter
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-engine

      - name: Run Unit Tests
        run: cargo test
        working-directory: rust-engine

  build_and_test_windows:
    name: Build & Test (Rust stable, Windows) — M1 Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-engine

      - name: Run Unit & Integration Tests (including M1 gates)
        run: cargo test --all
        working-directory: rust-engine

      - name: Build Release Binary
        run: cargo build --release -p taintflow-cli
        working-directory: rust-engine

      - name: Verify Protected VSIX Intact
        shell: pwsh
        run: |
          $vsix = "vscode/taintflow-1.1.3.vsix"
          if (Test-Path $vsix) {
            $len = (Get-Item $vsix).Length
            $hash = (Get-FileHash $vsix -Algorithm SHA256).Hash
            if ($len -ne 1407898) {
              Write-Error "VSIX size mismatch: expected 1407898, got $len"
              exit 1
            }
            if ($hash -ne "C86B52CC7CF313CE828AD52EA79075D9311F759887C17A5355F0CA743DCD798C") {
              Write-Error "VSIX hash mismatch: expected C86B52CC..., got $hash"
              exit 1
            }
            Write-Host "VSIX verified: size $len, hash $hash"
          } else {
            Write-Host "NOTE: Protected VSIX is an untracked local release asset; remote binary verification was skipped on clean runner checkout."
          }

      - name: Checkout Baseline Commit
        uses: actions/checkout@v4
        with:
          ref: '5d960bef8c0036f809106ff965a4b6a26840d37e'
          path: 'baseline-repo'

      - name: Build Baseline Binary
        run: cargo build --release -p taintflow-cli
        working-directory: baseline-repo/rust-engine

      - name: Run Baseline vs M1 Parity Test (TEST-PAR-01)
        shell: pwsh
        run: |
          # Test 1: Java snippet
          $fixtureJava = @(
            'String id = request.getParameter("id");',
            'stmt.executeQuery(id);'
          ) -join "`r`n"
          $fixtureJava | .\baseline-repo\rust-engine\target\release\taintflow-cli.exe --extract > baseline_java.json
          $baseExitJava = $LASTEXITCODE
          if ($baseExitJava -ne 0) {
            Write-Error "Baseline CLI failed on Java with code $baseExitJava"
            exit 1
          }
          $fixtureJava | .\rust-engine\target\release\taintflow-cli.exe --extract > m1_no_models_java.json
          $m1ExitJava = $LASTEXITCODE
          if ($m1ExitJava -ne 0) {
            Write-Error "M1 CLI failed on Java with code $m1ExitJava"
            exit 1
          }
          $baseBytesJava = [System.IO.File]::ReadAllBytes("baseline_java.json")
          $m1BytesJava = [System.IO.File]::ReadAllBytes("m1_no_models_java.json")
          if ($baseBytesJava.Length -ne $m1BytesJava.Length) {
            Write-Error "TEST-PAR-01 Java FAILED: byte length mismatch (baseline: $($baseBytesJava.Length), M1: $($m1BytesJava.Length))"
            exit 1
          }
          for ($i = 0; $i -lt $baseBytesJava.Length; $i++) {
            if ($baseBytesJava[$i] -ne $m1BytesJava[$i]) {
              Write-Error "TEST-PAR-01 Java FAILED: byte mismatch at offset $i"
              exit 1
            }
          }
          Write-Host "TEST-PAR-01 Java PASSED: byte-for-byte stdout parity confirmed ($($m1BytesJava.Length) bytes identical, exit code: $m1ExitJava)"

          # Test 2: Python snippet
          $fixturePy = @(
            'user = request.args["id"]',
            'cursor.execute(user)'
          ) -join "`r`n"
          $fixturePy | .\baseline-repo\rust-engine\target\release\taintflow-cli.exe --extract > baseline_py.json
          $baseExitPy = $LASTEXITCODE
          if ($baseExitPy -ne 0) {
            Write-Error "Baseline CLI failed on Python with code $baseExitPy"
            exit 1
          }
          $fixturePy | .\rust-engine\target\release\taintflow-cli.exe --extract > m1_no_models_py.json
          $m1ExitPy = $LASTEXITCODE
          if ($m1ExitPy -ne 0) {
            Write-Error "M1 CLI failed on Python with code $m1ExitPy"
            exit 1
          }
          $baseBytesPy = [System.IO.File]::ReadAllBytes("baseline_py.json")
          $m1BytesPy = [System.IO.File]::ReadAllBytes("m1_no_models_py.json")
          if ($baseBytesPy.Length -ne $m1BytesPy.Length) {
            Write-Error "TEST-PAR-01 Python FAILED: byte length mismatch (baseline: $($baseBytesPy.Length), M1: $($m1BytesPy.Length))"
            exit 1
          }
          for ($i = 0; $i -lt $baseBytesPy.Length; $i++) {
            if ($baseBytesPy[$i] -ne $m1BytesPy[$i]) {
              Write-Error "TEST-PAR-01 Python FAILED: byte mismatch at offset $i"
              exit 1
            }
          }
          Write-Host "TEST-PAR-01 Python PASSED: byte-for-byte stdout parity confirmed ($($m1BytesPy.Length) bytes identical, exit code: $m1ExitPy)"
