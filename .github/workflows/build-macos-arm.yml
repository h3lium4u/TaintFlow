name: Build macOS ARM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ARM target
        run: |
          rustup target add aarch64-apple-darwin

      - name: Build TaintFlow
        run: |
          cargo build --release --target aarch64-apple-darwin

      - name: Package ARM64 binary
        run: |
          tar -czvf taintflow-cli-aarch64-apple-darwin.tar.gz \
          LICENSE README.md \
          -C target/aarch64-apple-darwin/release taintflow-cli

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: taintflow-cli-aarch64-apple-darwin
          path: taintflow-cli-aarch64-apple-darwin.tar.gz
