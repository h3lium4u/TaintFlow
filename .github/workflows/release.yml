name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_artifacts:
    name: Build & Package Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: taintflow-cli-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: taintflow-cli-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: taintflow-cli-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: rust-engine

      - name: Assemble Release Folder
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp rust-engine/target/${{ matrix.target }}/release/taintflow-cli.exe dist/
          else
            cp rust-engine/target/${{ matrix.target }}/release/taintflow-cli dist/
          fi
          cp LICENSE dist/
          cp README.md dist/

      - name: Compress Release Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf ${{ matrix.archive }} -C dist .

      - name: Compress Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.archive }}

  create_github_release:
    name: Create GitHub Release
    needs: build_artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Binary Artifacts
        uses: actions/download-artifact@v4
        with:
          path: download

      - name: Gather Binary Archives
        run: |
          mv download/binary-*/* .
          rm -rf download

      - name: Generate SHA-256 Checksums
        run: sha256sum taintflow-cli-*.tar.gz taintflow-cli-*.zip > SHA256SUMS

      - name: Generate SPDX SBOM
        run: |
          cargo install cargo-sbom --locked
          cargo sbom --output-format spdx_json_2_3 > ../sbom.spdx.json
        working-directory: rust-engine

      - name: Verify SBOM Generation
        run: |
          ls -la
          find . -name "sbom.spdx.json"

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            taintflow-cli-x86_64-unknown-linux-gnu.tar.gz
            taintflow-cli-x86_64-pc-windows-msvc.zip
            taintflow-cli-x86_64-apple-darwin.tar.gz
            SHA256SUMS
            sbom.spdx.json
          draft: true
          prerelease: false
          body_path: release-preparation/release/GitHubReleaseTemplate.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
