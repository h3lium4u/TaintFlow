[package]
authors = ["Mohamed Faizaan"]
license = "MIT"
description = "Part of the TaintFlow static application security testing (SAST) engine."
repository = "https://github.com/MohamedFaizaan/TaintFlow"
homepage = "https://github.com/MohamedFaizaan/TaintFlow"
documentation = "https://docs.rs/taintflow"
name = "taintflow-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { path = "../parser" }
normalizer = { path = "../normalizer" }
symbols = { path = "../symbols" }
cfg = { path = "../cfg" }
taint = { path = "../taint" }
rules = { path = "../rules" }
features = { path = "../features" }
ir = { path = "../ir" }
semantic_rules = { path = "../semantic_rules" }
v2-export-adapter = { path = "../v2-export-adapter" }
v2-refiner-domain = { path = "../v2-refiner-domain" }
serde = { version = "1.0", features = ["derive"] }

serde_json = "1.0"
rayon = "1.8"

[[bin]]
name = "v2-validation"
path = "src/v2_validation.rs"

[[bin]]
name = "debug_transfer"
path = "src/bin/debug_transfer.rs"

[[bin]]
name = "debug_holdout"
path = "src/bin/debug_holdout.rs"

[[bin]]
name = "check_callgraph_edges"
path = "src/bin/check_callgraph_edges.rs"


